name: AgendaMobile
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
packages:
  AgendaSyncCore:
    path: ../apple/AgendaSyncCore
targets:
  AgendaMobile:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: AgendaSyncCore
        product: AgendaSyncCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willschulz.Agenda.iOS
        PRODUCT_NAME: Agenda
        DEVELOPMENT_TEAM: NK3J94B5PX
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AgendaMobile.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agenda
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIBackgroundModes:
          - remote-notification
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: AgendaMobile.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: AgendaMobileProduction.entitlements
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: 1
        com.apple.Push:
          enabled: 1
  AgendaMacCloudKitProvisioning:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - MacProvisioning
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willschulz.Agenda
        PRODUCT_NAME: AgendaCloudKitProvisioning
        DEVELOPMENT_TEAM: NK3J94B5PX
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ../mac/Agenda/AgendaDevelopment.entitlements
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: 5.0
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: 1
  AgendaMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: AgendaMobile
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Agenda.app/Agenda"
schemes:
  AgendaMobile:
    build:
      targets:
        AgendaMobile: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgendaMobileTests
      environmentVariables:
        AGENDA_DISABLE_CLOUDKIT: "1"
    archive:
      config: Release
  AgendaMacCloudKitProvisioning:
    build:
      targets:
        AgendaMacCloudKitProvisioning: all

