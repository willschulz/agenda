name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    name: Privacy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Scan tracked files
        run: scripts/verify-public.sh
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python -m unittest discover -s tests -v

  swift:
    name: Swift build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: AgendaSyncCore
        working-directory: apple/AgendaSyncCore
        run: swift test
      - name: macOS app
        working-directory: mac/Agenda
        run: swift test

  agent-pack:
    name: Agent integration pack
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: brew install ripgrep
      - run: agent-integration/scripts/verify-pack.sh
